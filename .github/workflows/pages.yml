name: Deploy web app to GitHub Pages

# Builds web/ and publishes it at https://rilay9.github.io/PianoProject/.
# The repository's github-pages environment must allow this branch to deploy.

on:
  push:
    branches: [claude/piano-loop]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Own concurrency group: the old branch's workflow used "pages", and its runs stuck in that queue
# left this branch's runs pending without starting.
concurrency:
  group: pages-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The fast checks first (owner, 2026-10-14: "Yes, gate deploys"): a failing one stops the deploy, and the app
      # stays on its last good version. The browser check (check:notes) is not here: it needs Playwright's browser.
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
