name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/piano-teaching-app-bo19td]
  workflow_dispatch: {}

# NOTE: deploys on push to `claude/piano-teaching-app-bo19td`, this repo's
# actual default branch (there is no `main` — see
# docs/decisions/2026-09-05-default-branch.md). Rename here if the default
# branch changes.
#
# One-time owner step: repository Settings -> Pages -> Source: GitHub Actions.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # CI's conversion cache and render manifest: the same path, key and
      # restore-keys as ci.yml's "Restore content build cache", so the deploy
      # starts from the cache the tested build left (Q75). Restore only, never
      # save: CI's job is the one that writes this cache, and a deploy should
      # not write one the tested build did not (actions/cache would save on a
      # miss; actions/cache/restore does not). The cache changes how long the
      # content build takes and never what it produces: each entry carries its
      # own key, and a miss converts the same sources to the same files
      # (docs/03 §3a). In particular it does not change the placeholders. This
      # job's build is the strict one (PIANOPATH_STRICT_LICENSE below), and a
      # strict build placeholders the CC BY-NC editions and the PDMX rows whose
      # composition is not public domain however warm the cache is (docs/03
      # §3a, "The public build's placeholders").
      - name: Restore content build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/cache
            build/render-manifest.json
          key: content-${{ hashFiles('tools/content/*.py', 'content/sources/*.json', 'app/package-lock.json') }}
          restore-keys: |
            content-

      - name: Install Python content-pipeline dependencies
        run: pip install -r tools/content/requirements.txt

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build (content + icons via prebuild, then the app)
        # docs/03 §1 and docs/00 D10a: --allow-nc bundles CC BY-NC editions and
        # is for the owner's own build only. This job publishes to the open
        # internet, so its content build must be the strict one.
        #
        # It used to run `build.py --strict-license` in a step of its own and
        # rely on `prebuild`'s `--if-missing` finding that catalog and skipping.
        # `--if-missing` is gone (replan §7.9), so ordering no longer protects
        # anything: the environment variable makes the single content build
        # inside `prebuild` strict, which is the guarantee this job actually
        # wants and does not depend on which step ran first.
        working-directory: app
        env:
          PIANOPATH_STRICT_LICENSE: '1'
        run: npm run build

      - name: Guard the deploy
        # Q88, the reviewer's Q86 ruling: a public build that could not fetch
        # content a healthy public build bundles (Mutopia's edition of Pine
        # Apple Rag today) validates with a warning, and must not replace the
        # last complete deployment. The guard reads the catalogue the upload
        # below publishes (vite copies app/public/content into app/dist) and
        # fails this job when a placeholder's reason is this build's own fetch
        # (validate.unfetched_placeholders), naming each; then nothing is
        # uploaded, deploy-pages does not run, and the previous deployment
        # stays live. Licence and import-only placeholders pass.
        # tools/content/tests/test_deploy_guard.py holds this step's place.
        run: python3 tools/content/deploy_guard.py --dir app/dist/content

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
