name: CI

on:
  push:
    branches: [claude/piano-teaching-app-bo19td]
    # A push that touches only the record and the review stream does not start a run, and
    # so cannot cancel the one in progress (Q63, 2026-09-29: the reviewer's response pushes
    # and the orchestrator's record pushes were cancelling every full run before it finished;
    # the owner asked for CI to run on the code and the review stream to stay out of its way).
    # The docs' own checks (the test map, the reviewer's views) run on the next code push.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
  pull_request:
    branches: [claude/piano-teaching-app-bo19td]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'

# One CI run per branch at a time: a newer push cancels the runs queued behind it, so the
# latest HEAD gets its conclusion instead of waiting behind every record commit (2026-09-26,
# when fourteen runs were in progress at once). A cancelled run is not a red one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: this repository's default branch is `claude/piano-teaching-app-bo19td`
# (there is no `main`). See docs/decisions/2026-09-05-default-branch.md.
# If the default branch is later renamed to `main`, update the branch names
# above and in pages.yml to match.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The conversion cache and the render manifest (replan §1.3). Both are
      # keyed on everything that decides their contents, so a hit can only make
      # the build faster, never different: the pipeline scripts, the source
      # list, and the lockfile that pins OpenSheetMusicDisplay. `restore-keys`
      # lets a changed key start from the closest previous cache rather than
      # cold — a partial cache is still correct, because every individual entry
      # carries its own key inside.
      - name: Restore content build cache
        uses: actions/cache@v4
        with:
          path: |
            build/cache
            build/render-manifest.json
          key: content-${{ hashFiles('tools/content/*.py', 'content/sources/*.json', 'app/package-lock.json') }}
          restore-keys: |
            content-

      - name: Install Python content-pipeline dependencies
        run: pip install -r tools/content/requirements.txt

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build content
        # Not --offline: the runner can reach GitHub, and fetching the score
        # library here is what proves the fetch step still works. A source that
        # cannot be reached is skipped rather than failing the build, so the
        # build does not depend on someone else's uptime; the content tests that
        # read a fetched edition (the Joplin rags) do, and fail naming the file.
        run: python3 tools/content/build.py

      - name: Content pipeline tests
        # After the build, never before (Q24, 2026-09-27). A test that reads the
        # built catalogue, the curriculum or an edition the build fetches fails
        # when that input is missing, naming the step that makes it, instead of
        # skipping; tools/content/tests/test_ci_order.py holds this order.
        run: python3 -m unittest discover -s tools/content/tests -t tools/content -v

      - name: MIDI converter harness
        # tools/midi-cleanup/midi_to_musicxml.py's own tests, on the committed
        # fixture. The three MAESTRO recordings its real-recording class reads
        # are not redistributable and nothing here fetches them, so that class
        # skips with its reason.
        run: python3 -m unittest discover -s tools/midi-cleanup/tests -v

      - name: Write the MIDI parity reference
        # What the Python converter decides for the committed fixtures, written
        # to build/midi-parity/ for midiParity.test.ts to hold the app's
        # TypeScript port to. Without it the unit tests fail naming this step.
        run: python3 tools/midi-cleanup/tests/parity_reference.py

      - name: Generate icons
        working-directory: app
        run: node scripts/generate-icons.mjs

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Unit tests
        working-directory: app
        run: npm run test

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: app
        run: npm run e2e

      - name: Build
        working-directory: app
        run: npm run build

      - name: Render every catalog item
        # The check that decides whether a score can be used at all: it loads
        # each file through the app's own loader and asserts the ScoreModel has
        # at least one step (docs/03 §3 steps 5-6).
        run: python3 tools/content/render_check.py --apply

      - name: Validate again, now that durations have been written
        # --apply *edits the catalog*, and this job validated it two steps ago,
        # so nothing had ever checked what the render check wrote. That is how
        # six Chopin durations of 22-40 minutes reached the catalog unnoticed:
        # `build.py --render` re-validates and would have caught them, but CI
        # runs the steps separately and did not. The render check now refuses to
        # write a duration the validator would reject; this step is what makes
        # that a guarantee rather than an intention.
        run: python3 tools/content/validate.py

      - name: Upload content previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-previews
          path: build/previews
          if-no-files-found: ignore
          retention-days: 7
