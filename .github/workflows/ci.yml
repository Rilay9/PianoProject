name: CI

on:
  push:
    branches: [claude/piano-teaching-app-bo19td]
  pull_request:
    branches: [claude/piano-teaching-app-bo19td]

# NOTE: this repository's default branch is `claude/piano-teaching-app-bo19td`
# (there is no `main`). See docs/decisions/2026-09-05-default-branch.md.
# If the default branch is later renamed to `main`, update the branch names
# above and in pages.yml to match.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python content-pipeline dependencies
        run: pip install -r tools/content/requirements.txt

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build content
        working-directory: app
        run: npm run content:build

      - name: Generate icons
        working-directory: app
        run: node scripts/generate-icons.mjs

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Unit tests
        working-directory: app
        run: npm run test

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: app
        run: npm run e2e

      - name: Build
        working-directory: app
        run: npm run build
