# The gap-analysis table (docs/prompts/inputs-2026-10-07/classifier-review.md): every characteristic
# placement needs, how verifiable it is, what code exists, and the gap. tools/classifier/build_matrix.py
# validates every row and renders generated/table.md from it. Rules are not here (no design yet).
#
# Fields, one row per characteristic:
#   area    notation | rhythm | reading | harmony | texture | form | technique | coordination | expression |
#           style | integrity | quality | pedagogy | difficulty | prereq | generated | meta
#   need    the placement question the row serves: cope (can the learner cope: prerequisites, nothing
#           untaught, difficulty) | exercises (does it exercise the target: how much, where, how
#           concentrated, what else at once) | material (is it good material for the job)
#   dec     the decision it feeds, in a few words
#   pipe    generated | pdmx | both   (generated: the generator's declared spec is the intent, and the
#           file is still read by the same analysers; pdmx: nothing declared, every value carries its
#           provenance: exact, two-witnesses, one-witness, inferred, metadata-only)
#   cls     CODE-EXACT | CODE-RULE | CODE-INFERENCE | EXTERNAL | JUDGMENT  (the five classes)
#   code    file:line of the code that measures it today, or none
#   status  EXISTS (that code has run on real catalogue items: the build measured 2,020 items on
#           2026-10-07) | PARTLY | MISSING
#   gap     what is missing, in one line
#   w2      the second, independent witness where one exists (a disagreement is reported, never passed)
#   src     for CODE-RULE: the published definition still to be quoted (NEEDED), or where it is;
#           notation = a printed symbol, reading the file is the definition
#   split   JUDGMENT rows only: {measurable: [row ids code can establish first], residual: "the smaller
#           question left to the agent"}  (every JUDGMENT row is challenged this way)
#   onedef  where a fact the app also uses must live: app/src/demands/detect.ts (one definition per fact)
#
# Facts checked on 2026-10-07 against .venv: music21 10.5.0 (92 feature extractors; Ottava, Trill,
# Mordent, Tremolo, Fermata, Crescendo, Fingering, Repeat, RepeatBracket, VoiceLeadingQuartet,
# floatingKey present; no pedal-mark class), partitura 1.9.0 (estimate_key, estimate_spelling,
# estimate_time, estimate_tonaltension, estimate_voices). Nothing else installed or checked.

# ===================================================================== prereq: can the learner cope
prereq.untaught-demands:    {area: prereq, need: cope, dec: "nothing the rung's ancestry has not taught", pipe: both, cls: CODE-EXACT, code: "tools/content/claims.py:474 untaught_on; :205 rung_ancestry", status: EXISTS, gap: "covers the 22 demands only; every CODE-RULE row below widens it", onedef: detect.ts}
prereq.taught-set-generated: {area: prereq, need: cope, dec: "a generated item uses only its family's allowed vocabulary", pipe: generated, cls: CODE-EXACT, code: "tools/content/family_contracts.py:249 pedagogical_faults (requires/forbids); tools/content/preflight_chains.py class 5", status: EXISTS, gap: "forbids are per demand id; range, rhythm vocabulary and harmonic plan are not declared for most families (generated.spec-complete)"}
prereq.hand-assignment:     {area: prereq, need: cope, dec: "which hand plays which notes (one-staff files, cross-staff)", pipe: both, cls: CODE-INFERENCE, code: "app/src/score/extractScoreModel.ts declaredHand; tools/content/verified_hand.py:103 verified_hands (facts)", status: PARTLY, gap: "a one-staff file takes the catalogue's declared hand; no inference from register or stems; confirming facts are hand-written rows", w2: "partitura note array staff field"}

