prereq.untaught-demands: {area: prereq, need: cope, dec: "nothing the rung's ancestry has not taught", pipe: both, evidence: EXACT, decision: DIRECT, code: "tools/content/claims.py:474 untaught_on; :205 rung_ancestry", status: EXISTS, gap: "covers the 22 demands only; every CODE-RULE row below widens it", onedef: detect.ts}
