integrity.lead-sheet-shape:  {area: integrity, need: cope, dec: "melody plus symbols, no written left hand", pipe: pdmx, cls: CODE-EXACT, code: "notation.staves and notation.chord-symbols", status: PARTLY, gap: "derivable; not derived"}
integrity.piano-range:       {area: integrity, need: cope, dec: "every note on the 88 keys", pipe: both, cls: CODE-EXACT, code: none, status: MISSING, gap: "min and max MIDI vs 21-108", w2: "partitura note array"}
integrity.hand-span:         {area: integrity, need: cope, dec: "no chord beyond a stated span", pipe: both, cls: CODE-RULE, code: "tools/content/difficulty.py:296 (maxSpan)", status: PARTLY, gap: "the value exists; the span rule per level is not written", w2: none, src: NEEDED}
integrity.notation-sanity:   {area: integrity, need: cope, dec: "spelling, beaming, voices, accidental churn as engraved", pipe: pdmx, cls: CODE-INFERENCE, code: none, status: MISSING, gap: "partitura estimate_spelling vs the file's spelling; beaming vs metre; FABLE §5 names these checks for generated items too", w2: "partitura estimate_spelling, estimate_voices"}
integrity.metadata-trust:    {area: integrity, need: material, dec: "composer, title and tags are uploader text", pipe: pdmx, cls: EXTERNAL, code: "tools/content/pdmx/quarry_core.py:95 identity; content/sources/composers.json; tools/content/licensing.py", status: PARTLY, gap: "composer matched against a table; title and tags carry no trust value on the row"}
integrity.arrangement-fidelity: {area: integrity, need: material, dec: "the upload represents the real piece", pipe: pdmx, cls: JUDGMENT, code: none, status: MISSING, gap: "cannot be proved from the file alone", w2: none, split: {measurable: [integrity.duplicate-version, integrity.truncation, integrity.key-consistency, integrity.title-structure], residual: "where uploads of the same work disagree, or only one exists, whether this one is a faithful arrangement (EXTERNAL where a reference edition or recording can be compared; judgment otherwise)"}}

# ===================================================================== style and genre: evidence, never proof
style.evidence:              {area: style, need: material, dec: "the stylistic signals: swing, cells, bass behaviour, chord vocabulary, harmonic rhythm, form, syncopation", pipe: both, cls: CODE-INFERENCE, code: "tools/content/candidates.py (narrows by notation facts); tools/content/pdmx/quarry_core.py:355 melody_signals", status: PARTLY, gap: "no vector of style signals with confidence on the row; each signal is a row above (texture.*, rhythm.*, harmony.*)", w2: none, src: NEEDED}
style.genre-label:           {area: style, need: material, dec: "a genre or track label", pipe: both, cls: CODE-INFERENCE, code: "catalogue genre (814 items, from source tags) and tracks", status: PARTLY, gap: "metadata only today; code can combine style.evidence with provenance into a label with confidence, never a proof", w2: meta.genre-tags, src: NEEDED}
style.good-example:          {area: style, need: material, dec: "a good teaching example of style X", pipe: both, cls: JUDGMENT, code: none, status: MISSING, gap: "judgment after code evidence", w2: none, split: {measurable: [style.evidence, harmony.voicing, harmony.rhythm, hands.per-bar-range, target.prevalence], residual: "whether what the code found is idiomatic for the style (the agent gets the measured voicings, attack rhythm, register and spacing, and answers only that)"}}

# ===================================================================== musical quality: is it good material (the third question)
quality.phrase-shape:        {area: quality, need: material, dec: "a beginning and an arrival", pipe: generated, cls: CODE-RULE, code: "tools/content/musical_evaluator.py:312 beginning; :369 arrival; :757 phrase_arrival", status: PARTLY, gap: "runs on generated phrases (one definition shared with app/src/engine/sightReadingScore.ts); nothing on PDMX; rules in code, not quoted", w2: none, src: NEEDED}
quality.contour:             {area: quality, need: material, dec: "contour shape, reversals, oscillation", pipe: generated, cls: CODE-RULE, code: "tools/content/musical_evaluator.py:449 contour_shapes; :508 contour", status: PARTLY, gap: "as quality.phrase-shape", w2: none, src: NEEDED}
quality.rests:               {area: quality, need: material, dec: "rests placed musically", pipe: generated, cls: CODE-RULE, code: "tools/content/musical_evaluator.py:635 rests", status: PARTLY, gap: "as quality.phrase-shape", w2: none, src: NEEDED}
quality.leap-recovery:       {area: quality, need: material, dec: "leaps resolved by step", pipe: generated, cls: CODE-RULE, code: "tools/content/musical_evaluator.py:664 leaps", status: PARTLY, gap: "as quality.phrase-shape", w2: none, src: NEEDED}
quality.cadence-close:       {area: quality, need: material, dec: "phrase ends on a stable degree with a cadence", pipe: generated, cls: CODE-RULE, code: "tools/content/musical_evaluator.py:739 cadence_close; :804 wrong_cadences", status: PARTLY, gap: "as quality.phrase-shape", w2: none, src: NEEDED}
quality.reference-distribution: {area: quality, need: material, dec: "within the real-music reference for its level on the FABLE §5 features", pipe: generated, cls: CODE-INFERENCE, code: none, status: MISSING, gap: "the reference set per level and the feature run (music21 or partitura, never the generator's read-back) are not built", w2: none, src: "FABLE §5 method 2"}
quality.coherence:           {area: quality, need: material, dec: "the item hangs together as music", pipe: both, cls: JUDGMENT, code: none, status: MISSING, gap: "no code", w2: none, split: {measurable: [quality.phrase-shape, quality.contour, melody.motif-repetition, quality.cadence-close, harmony.cadence, quality.reference-distribution], residual: "whether the measured phrase, motif and cadence facts add up to music worth playing; stated as 'unverified as music', never heard"}}
quality.idiomatic:           {area: quality, need: material, dec: "idiomatic for the instrument and style", pipe: both, cls: JUDGMENT, code: none, status: MISSING, gap: "no code", w2: none, split: {measurable: [technique.playability, technique.span, hands.per-bar-range, style.evidence], residual: "whether a playable, in-style passage is how a pianist would write it"}}
quality.pedagogical-fit:     {area: quality, need: material, dec: "a good introduction, consolidation or transfer item for this rung", pipe: both, cls: JUDGMENT, code: none, status: MISSING, gap: "code narrows heavily", w2: none, split: {measurable: [prereq.untaught-demands, difficulty.level, target.prevalence, target.salience, target.isolation, item.continuity, role.suitability], residual: "given every measured fact inside the rung's rule, whether this item is the one to teach with; the agent sees the facts and the open fields only"}}

