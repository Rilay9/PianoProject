# Every concept a rung names (content/curriculum/stage-*.json `concepts`), mapped to how an
# item is placed by it. tools/classifier/build_matrix.py fails if a rung concept is missing
# here or a concept here is on no rung.
#
# k (kind):
#   notes        - decided from the notes: the item must show the listed characteristics (ch)
#   meta         - decided from the source record, not the notes (ch are meta.* ids)
#   drill        - a generated drill; its parameters say what it holds (meta.generator-params)
#   played       - how it is played, not what is printed; ch are the printed signs used to choose items
#   activity     - the learner makes or does something; the item is input, not the skill
#   app          - an app mode or screen; no item property
# ch: characteristic ids (characteristics.yaml)
# instead: for played / activity / app, the rule used to choose items (keys below)
# amb: the concept name means different things on different rungs, or duplicates another
#      name; the rule must be written per rung (listed in research.md)
# The mapping is my reading of each concept name and the rungs that use it; the rungs are
# listed in generated/rungs.md for a second reader to check each row.

instead_rules:
  level-only: "Not an item property. Any item inside the rung's difficulty band and taught set serves."
  lead-sheet: "The learner makes the part. Items are lead sheets or charts with chord symbols (notation.chord-symbols), melody inside the rung's band."
  drill: "A generated drill; its parameters say what it holds and the family checker confirms the file."
  app: "An app mode or screen; reached through the app, never chosen by placement."
  played: "How it is played. Items are chosen by the listed printed or textural signs; the item cannot show the learner did it."
  by-ear: "The input is a recording or a heard phrase. Items are chosen by what the recording holds (research: sourcing recordings with known content)."

