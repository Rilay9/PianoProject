failure_routes:
  - observed: "The drill marks the tonic or the dominant wrong: a major third on i, a minor third on V7, or a natural-minor v."
    next: "Back to the definitions; build the three C minor shells in Free play and read each name; then the drill in C minor alone before its other keys."
  - observed: "The learner plays iim7's four notes (D-F-A-C) where the four-note iiø7 is asked, or cannot say what the shell leaves out."
    next: "Free play on D-F-A-C against D-F-A-flat-C, reading both names; the ear drill's m7 and half-diminished cards back to back, naming the quality before each echo; then the shell again, saying which note it drops."
  - observed: "On Blue Bossa's tonic the learner plays a minor-seventh shell (C-E-flat-B-flat) where the chart prints Cm6."
    next: "Back to the chart symbol and the lesson's sixth-chord line; build C-E-flat-A in Free play and read its name; then bars 5 to 7 of the chart again with Bass + drums on."
  - observed: "The progression falls apart in a new minor key in the Lab."
    next: "Back to C minor in Read it once, then the new key at a lower tempo; Hear it on the new key's build before playing it."
  - observed: "The changes arrive late on the chart: the shell lands after the bar has turned."
    next: "Lower the chart's tempo; return to Play the tune in the Lab, where the chord tones are lit; then the chart with Bass + drums on before the chorus without them."
  - observed: "The learner cannot find the progression in Insensatez."
    next: "Back to Blue Bossa bars 5 to 7 on the chart with Comp on; the lesson's line on the chord a fifth above the dominant's root; then Insensatez bars 13 to 15 again."
  - observed: "Optional bass step: the bossa bass collapses under the app's comp."
    next: "Back to A7c.3's control for the pattern (Rhythm only, then Keep tempo), then the chart at a lower tempo, ignoring the cell."
  - observed: "The learner cannot hear the progression in the tune."
    next: "No app tool checks hearing: return to the chart with Comp on and the named bars, and to the ear drill's half-diminished cards. Hearing it stays self-checked (unverified as music)."

independence_test: "Without the original scaffold, the learner looks at a chart no lesson has explained, finds its minor ii-V-i and says its key, rejects what only looks like one, and voices each in shells from the symbols in a key not practised: Insensatez whole on a later rung (bars 22 to 23 never named), then the A10.1 standard on jazz.9 once admitted. The app observes only the chart's live cell, unstored, which can say yes to a three-of-four-note shell and stores nothing; the identification, the voicing choice and hearing the progression are self-checked."

evidence:
  updates:
    - "One run of the minor ii-V-i shell drill (the minor form of drill.jazz.ii-v-i-shells, once G6 builds it) meeting its accuracy standard, opened from the placed rung, the requirement's items naming that drill (RECONCILIATION R28; a drill row passes on accuracy alone, MODE-SHEET section 0 R4). A run of the major shell drill, of any other exercise or of any song does not meet it."
  self_checked:
    - "Naming the chord qualities by ear (the ear drill echoes the chord; the spoken name is not stored)."
    - "Knowing what the shell leaves out, and choosing the tonic shell the symbol asks for."
    - "The progression in several keys in the Lab."
    - "Comping Blue Bossa from its chart, with and without the app's bass."
    - "The optional bossa bass on Blue Bossa."
    - "Finding the progression in Insensatez, and the independence test."
  never_credits:
    - "Recognising the minor ii-V-i by eye or by ear."
    - "Choosing a voicing: the drill asks for one set, and the Lab writes its own."
    - "Any Accompaniment lab row: a Read it import counts toward no rung, and Jam it stores nothing."
    - "The Chord chart's live cell, yes or no, in any bar."
    - "The chord name Free play shows."
    - "An ear-drill row, or a run of the major shell drill, standing for the minor shell drill."
    - "Any Hear it encounter, or a Keep tempo run of Blue Bossa's melody."
    - "That Blue Bossa contains the progression: playing the tune is not the ability (ORCHESTRATION-CONTRACT section 8)."

