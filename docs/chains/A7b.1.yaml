# The chain record for A7b.1, Minor ii-V-i with shells (FABLE.md section 3), with Blue Bossa as its real MODEL and MUSIC.
# Cut from docs/chains/skeletons/latin-cluster.md (section 9's Blue Bossa lines, section 10's checklist) and from
# docs/chains/A7c.1.yaml as the worked example of every field; field meanings are in ORCHESTRATION-CONTRACT.md section 1;
# every `recorded` and `cannot_establish` is copied from MODE-SHEET.md for the step's tool, never inferred. Sources for
# the teaching design: ABILITY-MAP.md A7b.1 (Capability, stations, Measurement, Completion) and A7c.3's L7 line (Blue
# Bossa as the MUSIC of the bossa bass); RECONCILIATION.md R27 (the Lab in several minor keys, Read it with Play it to
# me as the model, then Jam it), R28 (the counted drill named by `items`), R29 (a hearing step before construction;
# INDEPENDENCE voices the standard's minor ii-V-i in shells in a key not practised), R40-R41 (the chart's cell reads a
# root-fifth bass as no); ORCHESTRATION-CONTRACT.md section 8's minor ii-V-i chain; the reviewer's ruling that A7b.1 /
# Blue Bossa with the G6 control is the first post-Bizet brief (docs/review/responses/a3a8771d.md).
# status: draft. Refs, by when they resolve:
#  - resolve now: content/lessons/jazz.5.md (the lesson that teaches the major shells and holds the shell drill today;
#    the minor section's home, jazz.5 by R28 or jazz.6 by GENERATOR-ADDENDUM G6 and the map's MUSIC line, is the
#    placement seam's decision, and this ref moves with it); drill.jazz.ii-v-i-shells and drill.ear.seventh-qualities
#    (content/catalog.static.json); app/src/engine/sightReading.ts (the Lab's progression exercise and tune);
#    song.folk.insensatez-how-insensitive-jobim.pdmx (content/sources/pdmx.json, 32 bars); the Markdown anchors and the
#    test files named under `generated`.
#  - the first lane commits: QmTjGkyTi49tTTBrqFYXcTzdGaMMGrmViuc46mN7qmmGo6, Blue Bossa (Kenny Dorham), the quarry's
#    lead sheet: admitted by the probe (briefs/probe-bluebossa.md, Station 1) with the guarded text splice as
#    song.jazz.kenny-dorham-blue-bossa.pdmx (raw b2ef95b8..., converted b2a12ede...; intake/QmTj....md, personal
#    library ADMITTED, curriculum CANDIDATE), so its five refs resolve and the checker lists none for this record.
# Not built, so steps 4 and 11-13 cannot be played as written yet: the drill's minor form (G6: shellChord counts degrees
# on the major scale, app/src/engine/drills/theory.ts:353-380, so a minor i comes out as a major-seventh shell; CK-6 is
# not written); the placement (rung, lesson section, the requirement naming the drill). The record stays draft until
# both land and the reviewer reads it. A third capability, named by the reviewer's design ruling
# (docs/review/responses/a7b1-bluebossa-design.md section 4): the Chord chart cannot supply the rhythm section without
# its own chord comp (ChordChartScreen.ts: Bass + drums on forces comping on, and the backing is scheduled from
# compBar, which runs only while comping is on), so step 11 (Comp off, Bass + drums on) is blocked on an app seam that
# makes backing and comp independently switchable; that seam lands before this record is reviewed, and the probe only
# reproduces the coupling (Station 4) and drafts the seam.
# The harmony this record cites (Blue Bossa: Dm7b5 | G7(#5, add #9) | Cm6 at bars 5-7, 13-15, 21-23, 29-31, and
# Dm7b5-G7 in bar 16 into Cm6 at 17; Insensatez: Bm7b5 | E7(add b9) | Am7 at bars 13-15 and Bm7b5-E7(add b9) in bar 22
# into Am7 at 23) was one reader's: the drafter's raw walk of <harmony> on 2026-10-06, Blue Bossa in the quarry dump
# (docs/review/pdmx-quarry-2026-10-05/xml/B-jazz/), Insensatez in its committed .mxl. The probe's Station 2 verified
# it with two independent readers (a raw XML walk and music21) on both files' raw and committed identities, every
# symbol agreeing (the intake record's Claim checks, bound to those identities); two corrections: bar 16's G7 is a
# plain dominant (no alterations), and Insensatez 29-31 (Fmaj7 | E7(add b9) | Am7) is the look-alike, bVI-V-i.
# Premises the probe found wrong at the code (each its own seam, nothing here changed): the Chord chart's grid and
# comp take only a bar's first symbol (score/harmony.ts chartBars), so bar 16's G7 and Insensatez bar 22's E7 never
# show or sound and a correct shell there reads no; the chart prints the file's kind text, so the altered G7 shows
# as "G7"; Free play names none of D-F-C, G-B-F, C-E-flat-B-flat and calls C-E-flat-A "A diminished / C" (step 2's
# readout); the Lab's Read it score carries no chord symbols (the labels are on the Lab screen, not the page).
# The bossa bass itself (G14's pattern, its Rhythm only and Keep tempo steps) is A7c.3's CONTROL and belongs to A7c.3's
# record; this record carries only A7c.3's L7 step, where the map makes Blue Bossa the bass's MUSIC (step 13, optional,
# offered once A7c.3's pattern is on the learner's path). G14 waits for A7c.3 (responses/a3a8771d.md).
ability: A7b.1
learner_cannot: "Voice the minor ii-V-i (iiø7, V7, i) in shells in two or three minor keys, know that a root-3-7 shell cannot show the half-diminished chord's flat fifth, or recognise the progression in a tune. No jazz lesson teaches it (ABILITY-MAP A7b.1, Evidence); jazz.5's shell drill is major only and cannot express a minor key (G6); no admitted score prints the progression: the shipped Fly Me to the Moon prints a tritone-substituted setting, and Blue Bossa, which prints it, is not yet in the catalogue."
independent_target: "Looks at a chart no lesson has explained, finds its minor ii-V-i and says its key, and voices each one in shells from the symbols, the tonic shell the symbol asks for, in a key not practised."
