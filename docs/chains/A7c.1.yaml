failure_routes:
  - observed: "Wrong or missed pitches in Keep tempo on the cut (the leap D2-A2-F3, or the change to B-flat 2 and G3 in bars 8 to 11)."
    next: "Wait for me on the cut (pitch without the clock); then Loop the trouble bars (7 to 9) in Wait; then Keep tempo at a lower tempo."
  - observed: "Pitches right, but the second and third onsets drift, early or late at the sixteenth, so the cell blurs into even eighths or a straight dotted pair."
    next: "Rhythm only on a Loop of bars 1 and 2; return to Hear it on the same bars; count aloud while tapping; then restore pitches at a lower tempo."
  - observed: "The learner taps or plays a tresillo where the habanera is written, or the reverse."
    next: "Back to the definitions and Hear it on both items; then the back-to-back taps, naming the half-bar onset before each attempt."
  - observed: "The cut is right below the written tempo and breaks at the pass pair."
    next: "Raise the tempo in small steps by hand. Ladder over a Loop of the cut is available (an in-session climb only, MODE-SHEET section 12); the lesson says a later day's cold run is the real check."
  - observed: "In context the bass falls apart under the app's right hand."
    next: "Back to the cut alone; then Loop bars 4 to 7 of the parent with the left hand chosen; then the whole twelve bars."
  - observed: "The tresillo exercise fails in a new key."
    next: "Back to the key of C, Rhythm only once, then the new key at a lower tempo."
  - observed: "The learner cannot tell the cells apart by ear on Hear it."
    next: "No app tool checks hearing: return to tapping and to the printed onsets. Telling them apart by ear stays self-checked (unverified as music)."

independence_test: "Without the original scaffold, the learner looks at a left hand they have not been told about and says which cell it uses, and where it stops using it, before hearing it: Por Una Cabeza bars 1 to 14 at the identification step inside latin.4, then the latin.6 and latin.7 pieces. Afterwards the learner taps or plays that left hand at a tempo they choose. The app can observe only the rhythm-only or Keep tempo row of what they then play; the identification, the choice of where the cell breaks and hearing the difference are self-checked."

evidence:
  updates:
    - "One Keep tempo run of a tresillo exercise meeting the pass pair (90 % accuracy at 80 % tempo), opened from latin.4 (completion treatment CT-3)."
    - "One Keep tempo run of the Bizet left-hand cut meeting the pass pair, opened from latin.4; a left-hand-only run counts because the required item is itself the left-hand excerpt."
  self_checked:
    - "Naming and counting the cells."
    - "The contrast between the two cells."
    - "Hearing the difference."
    - "The in-context left hand and any both-hands try."
    - "Finding the tresillo in The Crave."
    - "The identification and the independence test."
  never_credits:
    - "Recognising the habanera and the tresillo, by eye or by ear."
    - "The cell's identity at speed (the timing window cannot resolve it)."
    - "Hands-together playing."
    - "Anything from Hear it, Rhythm only or Wait rows."
    - "A looped partial lap standing for the whole cut (today's code does not prevent this; the lesson says what the counted run is)."

