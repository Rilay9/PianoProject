# The chain record for A7c.1, Habanera and tresillo as distinct cells (FABLE.md section 3).
# Transcribed from the teaching design in
# docs/prompts/runs/curriculum-review-2026-10-05/briefs/probe-latin4-bizet.md (instructional chain,
# failure route, independence test, completion treatment); field meanings are in ORCHESTRATION-CONTRACT.md
# section 1, what each tool records is in MODE-SHEET.md. Where the probe's table row held two items or
# two tools, the record has one step for each, because a step holds one content and one tool.
# status stays draft. The cut's id resolves: the probe merged its approval into content/sources/excerpts.json
# (event ex-d9d06e1d-f740-4a7e-a03f-dd954827e1d4). latin.4's lesson file exists since the placement seam (LP1:
# content/lessons/latin.4.md), so every ref resolves; the probe had stopped at its Station 5, where
# excerpts.py --candidate-rungs did not list latin.4 for the cut, a reader LP1 corrected. Step 6 of the probe's
# table (the back-to-back contrast) is two steps here, one per content, per the review of 2026-10-06 (responses/bb6289f2.md section 3, item 1).
# G13 (briefs/g13-habanera-control.md, as ruled in docs/review/responses/g13-habanera-control.md): the contrast
# (steps 6 and 7) now taps a generated 2/4 pair at quarter = 60 in C that differs only in the onset cell, the
# family bass_cell (the habanera drill and its 2/4 tresillo control); three steps play the habanera drill at pitch
# (C, then F or G); the counted exercise run is the 2/4 tresillo control, which the latin.4 requirement names; the
# 4/4 tresillo steps stay as practice and continuity from latin.3 and count toward nothing. The bass_cell exercise
# ids are listed unresolved in this draft: the checker resolves an exercise id only through
# tools/content/generator_continuity.json, which holds only families whose version moved (a checker gap, open
# before reviewed). The step-20 task line on latin.6 and latin.7 is still outstanding.
ability: A7c.1
learner_cannot: "Name or play the habanera bass (a dotted eighth, a sixteenth and two eighths in a 2/4 bar), tell it from the tresillo on the page or by ear, or know that the Argentine tango figures descend from it. latin.3 names and explains the tresillo as 3+3+2; no lesson teaches the habanera as the contrasting cell, or asks the learner to tell the two apart or apply them, and Por Una Cabeza carries the habanera in 56 of its 66 bars with nothing pointing the learner at it."
independent_target: "Looks at a left hand they have not been told about and says which cell it uses, and where it stops using it, before hearing it; afterwards taps or plays that left hand at a tempo they choose."
