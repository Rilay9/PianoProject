<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Piano</title>
</head>
<body>
  <!-- Controls layer: a top bar and a bottom bar over the music, shown when a song opens and on a tap. -->
  <header class="bar top" id="top-bar">
    <button id="open-songs" type="button" class="btn" aria-label="Songs">‹</button>
    <div class="title"><span id="song-title"></span> <small id="song-composer"></small></div>
    <button id="open-info" type="button" class="btn" aria-label="About this song">ⓘ</button>
    <button id="open-settings" type="button" class="btn" aria-haspopup="dialog">Display</button>
  </header>
  <div class="bar bottom" id="bottom-bar" role="toolbar" aria-label="Playing and display for this song">
    <button id="play" type="button" class="btn play" aria-label="Play">▶</button>
    <button id="open-tempo" type="button" class="btn" aria-haspopup="dialog" aria-label="Tempo">♩ <span id="q-bpm"></span></button>
    <button id="q-smaller" type="button" class="btn" aria-label="Smaller notation">A−</button>
    <output id="q-size" aria-live="polite"></output>
    <button id="q-larger" type="button" class="btn" aria-label="Larger notation">A+</button>
    <select id="q-spacing" aria-label="Spacing">
      <option value="tight">Tight</option>
      <option value="compact">Compact</option>
      <option value="open">Open</option>
    </select>
    <button id="q-default" type="button" class="btn" hidden>Make default</button>
  </div>

  <p id="message" class="message" hidden></p>
  <main id="score" class="score"></main>
  <!-- Under the music: keyboard, note names, both or nothing; the bottom bar covers it while showing. -->
  <div id="under" class="under" hidden>
    <div id="note-line" class="note-line" hidden></div>
    <div id="keyboard" class="keyboard" hidden></div>
  </div>

  <dialog id="songs" aria-labelledby="songs-title">
    <form method="dialog">
      <h2 id="songs-title">Songs</h2>
      <ul id="song-list" class="song-list"></ul>
      <div class="actions"><button value="close">Close</button></div>
    </form>
  </dialog>

  <dialog id="info" aria-labelledby="info-title">
    <form method="dialog">
      <h2 id="info-title"></h2>
      <p id="info-body" class="note"></p>
      <div class="actions"><button value="close">Close</button></div>
    </form>
  </dialog>

  <dialog id="tempo" aria-labelledby="tempo-title">
    <form method="dialog">
      <h2 id="tempo-title">Tempo</h2>
      <label class="row">Speed
        <input id="t-speed" type="range" min="25" max="200" step="5">
        <output id="t-speed-out"></output>
      </label>
      <label class="row">Beats per minute <input id="t-bpm" type="number" min="1" step="1" inputmode="numeric"></label>
      <p id="t-note" class="note"></p>
      <div class="actions">
        <button id="t-reset" type="button">Song's own tempo</button>
        <button value="close">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Display</h2>
      <p id="override-note" class="note"></p>

      <label class="row">Notation size
        <input id="s-size" type="range" min="0.6" max="1.8" step="0.05">
        <output id="s-size-out"></output>
      </label>

      <fieldset class="row"><legend>Spacing</legend>
        <label><input type="radio" name="spacing" value="open"> Open</label>
        <label><input type="radio" name="spacing" value="compact"> Compact</label>
        <label><input type="radio" name="spacing" value="tight"> Tight</label>
      </fieldset>

      <fieldset class="row" id="layout-choices"><legend>Layout</legend></fieldset>

      <fieldset class="row" id="slot-choices"><legend>Slots</legend></fieldset>

      <fieldset class="row"><legend>Marker</legend>
        <label><input type="radio" name="marker" value="bar"> Bar</label>
        <label><input type="radio" name="marker" value="notes"> Coloured notes</label>
        <label><input type="radio" name="marker" value="both"> Both</label>
      </fieldset>

      <fieldset class="row"><legend>Marker follows</legend>
        <label><input type="radio" name="markerFollows" value="split"> Each hand</label>
        <label><input type="radio" name="markerFollows" value="ahead"> Hand furthest ahead</label>
        <label><input type="radio" name="markerFollows" value="behind"> Hand furthest behind</label>
      </fieldset>

      <fieldset class="row"><legend>Under the music</legend>
        <label><input type="radio" name="under" value="keyboard"> Keyboard</label>
        <label><input type="radio" name="under" value="notes"> Note names</label>
        <label><input type="radio" name="under" value="both"> Both</label>
        <label><input type="radio" name="under" value="nothing"> Nothing</label>
      </fieldset>

      <fieldset class="row" id="lines-choices"><legend>Bars per slot</legend>
        <label><input type="radio" name="lines" value="auto"> As many as fit</label>
        <label><input type="radio" name="lines" value="file"> As in the file</label>
        <label><input type="radio" name="lines" value="1"> 1 bar</label>
        <label><input type="radio" name="lines" value="2"> 2</label>
        <label><input type="radio" name="lines" value="3"> 3</label>
        <label><input type="radio" name="lines" value="4"> 4</label>
        <label><input type="radio" name="lines" value="6"> 6</label>
      </fieldset>

      <fieldset class="row"><legend>Bar numbers</legend>
        <label><input type="radio" name="barNumbers" value="off"> Off</label>
        <label><input type="radio" name="barNumbers" value="lines"> Line starts</label>
        <label><input type="radio" name="barNumbers" value="every"> Every bar</label>
      </fieldset>

      <fieldset class="row"><legend>Show</legend>
        <label><input id="s-tempoMarks" type="checkbox"> Tempo marks</label>
        <label><input id="s-fingering" type="checkbox"> Fingering</label>
        <label><input id="s-lyrics" type="checkbox"> Lyrics</label>
      </fieldset>

      <div class="actions">
        <button id="make-default" type="button">Make default</button>
        <button id="reset-piece" type="button">Reset this song</button>
        <button value="close">Done</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
