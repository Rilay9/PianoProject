<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Piano</title>
</head>
<body>
  <header class="bar">
    <select id="piece" aria-label="Score"></select>
    <button id="open-settings" type="button" aria-haspopup="dialog">Display</button>
  </header>
  <p id="message" class="message" hidden></p>
  <main id="score" class="score"></main>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Display</h2>
      <p id="override-note" class="note"></p>

      <label class="row">Notation size
        <input id="s-size" type="range" min="0.6" max="1.8" step="0.05">
        <output id="s-size-out"></output>
      </label>

      <fieldset class="row"><legend>Spacing</legend>
        <label><input type="radio" name="spacing" value="open"> Open</label>
        <label><input type="radio" name="spacing" value="compact"> Compact</label>
        <label><input type="radio" name="spacing" value="tight"> Tight</label>
      </fieldset>

      <fieldset class="row"><legend>Layout</legend>
        <label><input type="radio" name="layout" value="auto"> Auto</label>
        <label><input type="radio" name="layout" value="page"> Page</label>
        <label><input type="radio" name="layout" value="strip"> One line</label>
      </fieldset>

      <fieldset class="row"><legend>Bar numbers</legend>
        <label><input type="radio" name="barNumbers" value="off"> Off</label>
        <label><input type="radio" name="barNumbers" value="lines"> Line starts</label>
        <label><input type="radio" name="barNumbers" value="every"> Every bar</label>
      </fieldset>

      <fieldset class="row"><legend>Show</legend>
        <label><input id="s-tempoMarks" type="checkbox"> Tempo marks</label>
        <label><input id="s-fingering" type="checkbox"> Fingering</label>
        <label><input id="s-lyrics" type="checkbox"> Lyrics</label>
      </fieldset>

      <div class="actions">
        <button id="make-default" type="button">Use for all pieces</button>
        <button id="reset-piece" type="button">Reset this piece</button>
        <button value="close">Done</button>
      </div>
      <p id="about" class="note"></p>
    </form>
  </dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
